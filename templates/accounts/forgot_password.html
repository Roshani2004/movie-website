{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <h2 style="margin-bottom: 0.5rem;">Forgot Password</h2>
    <p style="color:#888; margin-bottom: 1.5rem;">
        Enter your registered email. We'll send you a 6-digit reset code.
    </p>
    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Email address" required
               style="width:100%;padding:0.9rem;background:#111;border:1px solid #333;border-radius:6px;color:white;margin-bottom:1rem;">
        <button type="submit" class="btn" style="width:100%;padding:1rem;">Send Reset Code</button>
    </form>
    <p style="margin-top:1.5rem;text-align:center;color:#888;">
        <a href="{% url 'login' %}" style="color:#e50914;">Back to login</a>
    </p>
</div>
{% endblock %}
