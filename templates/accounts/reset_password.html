{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <h2 style="margin-bottom: 0.5rem;">Reset Password</h2>
    <p style="color:#888; margin-bottom: 1.5rem;">
        Enter the 6-digit code from your email and choose a new password.
    </p>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="otp" placeholder="6-digit code" maxlength="6"
               pattern="[0-9]{6}" inputmode="numeric" required
               style="width:100%;padding:1rem;font-size:1.3rem;text-align:center;letter-spacing:0.5rem;background:#111;border:1px solid #333;border-radius:6px;color:white;margin-bottom:0.8rem;">
        <input type="password" name="password" placeholder="New password (min 8 characters)" required
               style="width:100%;padding:0.9rem;background:#111;border:1px solid #333;border-radius:6px;color:white;margin-bottom:0.8rem;">
        <input type="password" name="password2" placeholder="Confirm new password" required
               style="width:100%;padding:0.9rem;background:#111;border:1px solid #333;border-radius:6px;color:white;margin-bottom:1rem;">
        <button type="submit" class="btn" style="width:100%;padding:1rem;">Reset Password</button>
    </form>
</div>
{% endblock %}
